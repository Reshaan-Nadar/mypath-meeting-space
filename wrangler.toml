name = "mypath"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Serve the static frontend (public/) via Workers Static Assets.
# Requests that don't match an API route fall through to these files.
[assets]
directory = "./public"
binding = "ASSETS"

# Non-secret config. Secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ADMIN_HASH)
# are set via `wrangler secret put ...` and read from `env` at runtime.
[vars]
