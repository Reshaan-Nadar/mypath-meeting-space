[package]
name = "mypath-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono"] }
chrono = { version = "0.4.38", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tower = "0.5.3"
